<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>18th, she</title>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,500;1,400;1,500&family=Jost:wght@400;500;600&family=Marcellus&display=swap" rel="stylesheet">
<style>
:root{--ink:#0c0b0c;--paper:#fbf9f8;--card:#f1ecea;--sky:#6fa9db;--slate:#6f89ad;--red:#c4161c;--maroon:#6a474b;--rose:#e9a7bb;--txt:#3a3335;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--ink);color:var(--txt);font:400 clamp(1rem,.94rem + .3vw,1.15rem)/1.75 "Jost",system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3,p{margin:0}
.serif{font-family:"Bodoni Moda",Didot,Georgia,serif;font-weight:400}
.num{font-family:"Bodoni Moda",Georgia,serif;font-style:italic;font-weight:400;font-size:clamp(7rem,26vw,16rem);line-height:.72;display:inline-block}
.wrap{width:min(1180px,100% - 2.5rem);margin-inline:auto;position:relative;z-index:1}
section{position:relative;overflow:hidden}
:focus-visible{outline:2px solid var(--rose);outline-offset:3px}
.im{display:block;position:relative;overflow:hidden}
.im img{width:100%;height:100%;object-fit:cover;display:block}
.fill{position:absolute;inset:0}
.pol{background:#fff;padding:8px 8px 32px;box-shadow:0 18px 36px -16px rgba(0,0,0,.55)}
.pol .im{width:100%;height:100%}
.card{background:var(--card);padding:clamp(1.4rem,4vw,2.6rem);box-shadow:0 24px 50px -24px rgba(0,0,0,.5);font-family:"Marcellus",serif;font-size:clamp(1.05rem,1rem + .5vw,1.4rem);line-height:1.6;color:#4b4245}
.card h3{font:600 clamp(1.1rem,1rem + .7vw,1.55rem)/1.35 "Marcellus",serif;color:#2c2528;margin-bottom:.8rem}
.rv{opacity:0;transform:translateY(24px);transition:opacity 1s,transform 1s}.rv.in{opacity:1;transform:none}

/* gate */
#gate{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:1.25rem;background:radial-gradient(ellipse at 25% 15%,#4a3238,#0c0b0c 70%);transition:opacity .9s,visibility .9s}
#gate.open{opacity:0;visibility:hidden;pointer-events:none}
.gc{width:min(380px,100%);text-align:center;color:#f6efed}
.gc .num{color:#fff;font-size:clamp(5.5rem,24vw,8rem);margin-bottom:.4rem}
.gc h1{font:400 1.5rem/1.2 "Bodoni Moda",serif;letter-spacing:.02em}
.gc p{opacity:.7;font-size:.95rem;margin:.5rem 0 1.6rem}
#pin{width:100%;background:transparent;border:0;border-bottom:1px solid rgba(255,255,255,.5);color:#fff;text-align:center;font:500 1.7rem "Jost";letter-spacing:.7em;padding:.6rem .2rem .6rem .9rem;border-radius:0}
#pin::placeholder{opacity:.3;letter-spacing:.5em}
#err{min-height:1.7em;margin:.7rem 0;color:var(--rose);font-size:.9rem}
.btn{border:0;min-height:48px;padding:.85rem 2rem;background:#fff;color:#1b1517;font:500 .95rem "Jost";letter-spacing:.04em;cursor:pointer}
.shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

/* hero */
#hero{min-height:100svh;display:grid;color:#fff;background:#1a1416}
#hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,.45) 60%,rgba(0,0,0,.7))}
.hin{min-height:100svh;display:flex;flex-wrap:wrap;align-content:center;align-items:center;justify-content:space-between;gap:1rem 2rem;padding:3rem 0}
.hin h1{font:400 clamp(3rem,11vw,8.5rem)/.95 "Bodoni Moda",serif;letter-spacing:.01em}
.hin h1 span{display:block;opacity:.7}
.hin .num{font-size:clamp(5rem,20vw,13rem);margin-left:auto;align-self:flex-start;margin-top:8vh}
.cue{position:absolute;z-index:2;bottom:1rem;left:50%;width:1px;height:46px;background:linear-gradient(#fff,transparent)}

/* 3 things */
#things{min-height:100svh;display:grid;align-items:center;color:#fff;background:#151213}
.collage{position:absolute;inset:-12% -25%;display:grid;grid-template-columns:repeat(7,1fr);gap:12px;transform:rotate(-9deg)}
.collage .pol{aspect-ratio:3/4;padding:6px 6px 6px;background:#ece7e6}
#things::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(8,6,7,.78),rgba(8,6,7,.55) 60%,rgba(8,6,7,.9))}
#things h2{font:400 clamp(2.2rem,8vw,6rem)/1.1 "Bodoni Moda",serif;text-align:center;padding:4rem 0}
#things h2 .num{font-size:2.6em;vertical-align:middle;margin-right:.05em;line-height:.8}
#things h2 .n18{font-style:italic;font-size:1.7em;line-height:.8}
@media(max-width:600px){.collage{grid-template-columns:repeat(4,1fr)}}

/* sakti */
#sakti{padding:clamp(3rem,8vw,6rem) 0;background:radial-gradient(ellipse 40% 22% at 85% 18%,rgba(255,255,255,.75),transparent),radial-gradient(ellipse 35% 20% at 8% 62%,rgba(255,255,255,.6),transparent),linear-gradient(180deg,#5f9dd4,#a6cbea 60%,#d9e8f4)}
.sh{display:flex;align-items:baseline;flex-wrap:wrap;gap:.2em .35em;color:#fff;font:400 clamp(2.6rem,9vw,6rem)/1 "Bodoni Moda",serif}
.sh .num{font-size:2.2em;vertical-align:bottom;margin-right:-.05em}
.sh b{color:var(--red);font-weight:500}
.badge{position:absolute;top:0;right:0;width:clamp(78px,12vw,104px);aspect-ratio:1;background:var(--red);color:#fff;display:grid;place-items:center;text-align:center;font:600 .5rem/1.3 "Jost";letter-spacing:.04em;padding:.5rem}
.sg{display:grid;gap:2rem;margin-top:2rem;align-items:end}
.cut{border:7px solid var(--red);border-radius:28px 28px 0 0;width:min(340px,80%);aspect-ratio:3/4;justify-self:center;background:#fff;margin-bottom:-6px}
@media(min-width:769px){.sg{grid-template-columns:1.5fr 1fr}.cut{width:100%}}

/* rank 2 */
#rank{padding:clamp(3rem,8vw,6rem) 0;background:repeating-linear-gradient(90deg,transparent 0 calc(25% - 4px),rgba(255,255,255,.14) calc(25% - 4px) 25%),linear-gradient(160deg,#7f98b9,#667fa4)}
.rh{display:flex;align-items:center;flex-wrap:wrap;gap:.2em .4em;color:#fff;font:400 clamp(2.2rem,7vw,4.4rem)/1.1 "Bodoni Moda",serif}
.rh .num{font-size:2.8em;line-height:.8}
.rh mark{background:var(--maroon);color:#fff;padding:.05em .25em}
.rg{display:grid;gap:2.5rem;margin-top:2.2rem}
.pols{position:relative;height:clamp(340px,75vw,480px)}
.pols .pol{position:absolute}
.p1{width:58%;aspect-ratio:4/5;right:0;top:0;transform:rotate(7deg)}
.p2{width:44%;aspect-ratio:1;left:4%;top:36%;transform:rotate(-4deg);z-index:2}
.p3{width:40%;aspect-ratio:1;right:2%;bottom:0;transform:rotate(3deg)}
.star{position:absolute;left:46%;top:-10px;color:var(--rose)}
@media(min-width:769px){.rg{grid-template-columns:1fr 1.1fr;align-items:center}}

/* first */
#first{background:var(--paper);padding:clamp(3rem,8vw,6rem) 0;color:#1d1719}
.fh{display:flex;align-items:flex-end;flex-wrap:wrap;gap:0 .3em;font:400 clamp(2.4rem,8vw,5rem)/1 "Bodoni Moda",serif;color:#161012}
.fh .num{font-size:2.3em;color:#0c0b0c}
.fg{display:grid;gap:2.5rem;margin-top:2rem}
.ft{text-align:justify;font-family:"Jost";font-size:clamp(1rem,.95rem + .3vw,1.15rem);line-height:1.7}
.ft p+p{margin-top:1.3rem}
.cl{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:clamp(52px,10vw,84px);align-self:center}
.cl .im{background:#ccc}
@media(min-width:769px){.fg{grid-template-columns:1.1fr 1fr}}

/* love */
#love{background:#fff;padding:clamp(3rem,8vw,6rem) 0}
.lg{display:grid;gap:2.5rem;align-items:center}
.lp{position:relative;aspect-ratio:4/5;color:#161012}
.lp .num{position:absolute;left:18%;top:28%;font-size:clamp(8rem,28vw,15rem);z-index:2}
.lp .num sup{font-size:.28em;vertical-align:baseline;position:relative;top:.55em}
.lp .sig{position:absolute;left:0;right:0;bottom:6%;text-align:center;font:italic 400 clamp(1.4rem,4vw,2rem) "Bodoni Moda",serif;color:#fff;z-index:2}
.lt h2{font:italic 400 clamp(3rem,9vw,5.5rem)/1 "Bodoni Moda",serif;color:#161012;margin-bottom:1.4rem}
.lt p{font-family:"Marcellus",serif;font-size:clamp(1.05rem,1rem + .4vw,1.3rem);line-height:1.65;color:#2b2326}
.lt p+p{margin-top:1.5rem}
@media(min-width:769px){.lg{grid-template-columns:1.25fr 1fr}}

/* final */
#final{background:#000;min-height:100svh;display:grid;place-items:center;padding:0}
.fin{position:relative;width:min(1240px,100%);min-height:min(100svh,760px);aspect-ratio:16/9;display:grid;place-items:center;text-align:center;color:#fff;background:#2a1517}
.fin::after{content:"";position:absolute;inset:0;background:rgba(40,8,10,.55)}
.fin div{position:relative;z-index:2;padding:1.5rem}
.fin h2{font:400 clamp(3rem,11vw,8.5rem)/1 "Bodoni Moda",serif}
.fin p{font:400 clamp(1.4rem,4.5vw,3rem)/1.2 "Jost",sans-serif;margin-top:.4rem}
footer{background:#000;color:#bdb2b4;text-align:center;font-size:.85rem;padding:1.2rem 1rem 1.6rem}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation:none!important;scroll-behavior:auto!important}.rv{opacity:1;transform:none}}
</style>
</head>
<body>

<div id="gate" role="dialog" aria-labelledby="gt">
  <div class="gc" id="gcard">
    <div class="num" aria-hidden="true">20<span style="font-size:.35em">th</span></div>
    <h1 id="gt">Ada kejutan buat kamu</h1>
    <p>Masukkan tanggal spesial kita.</p>
    <label for="pin" style="position:absolute;left:-9999px">PIN</label>
    <input id="pin" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="••••••" aria-describedby="err">
    <div id="err" role="alert" aria-live="polite"></div>
    <button id="go" class="btn" type="button">Buka kejutan</button>
  </div>
</div>
<main id="app" aria-hidden="true"></main>

<script>
/* =====================================================
   ✏️ EDIT DI SINI — semua teks & path foto ada di CONTENT.
   Foto: taruh di folder images/ sesuai path di bawah.
   Foto belum ada = otomatis jadi kotak warna (layout tetap rapi).
   ===================================================== */
const PIN = "200926";
const CONTENT = {
  name: "Azzahra Awwalia Ramadhani",
  hero: { photo: "bg.jpg", line1: "HAPPY", line2: "BIRTHDAY!", age: "20", suffix: "th" },

  // Bagian "3 things you get when you turn 20" — latar kolase foto miring
  things: { num: "3", text: "things you get when you turn", age: "20",
    collage: Array.from({ length: 21 }, (_, i) => `images/collage/${String(i + 1).padStart(2, "0")}.jpg`) },

  sakti: { num: "3.", w1: "jadi", w2: "Pacar Aku", badge: "OFFICIALLY MY FAVORITE PERSON", photo: "5.jpg",
    head: "SELAMAT YAAWW UDAH BERHASIL MENGAMANKAN POSISI DI HATI AKUUU",
    text: "WKWKWK SELAMAT YAA SAYANGGG!! dari sekian banyak orang di dunia ini, akhirnya kamu berhasil jadi orang yang punya tempat spesial di hati aku. DAN KERENNYA LAGI, POSISI INI UDAH RESMI JADI MILIK AZZAHRA AWWALIA RAMADHANI!! aku bisa pastiin ga bakal ada pergantian posisi sampai kapan pun yaa WKWKWK. CONGRATS MY GIRL, LOVE U SO MUCHH!!" },

  rank: { label: "Rank", num: "2", highlight: "Through Consistency!!", photos: ["1.jpg", "2.jpg", "3.jpg"],
    head: "KAMU TUH KEREN BANGETT!!",
    text: "JUJUR AKU KAGUM SAMA KAMU!! mungkin kamu sendiri nggak sadar seberapa hebatnya diri kamu, tapi aku lihat itu. dari cara kamu menghadapi masalah, cara kamu berusaha, sampai cara kamu tetap bertahan meskipun nggak semuanya berjalan sesuai keinginan kamu. PROUD OF YOU, ZARAA!!" },

  first: { pre: "The first", num: "1", post: "on my mind",
    photos: ["diri 1.2.jpg", "bagus.jpg", "imut.jpg", "solo.jpg", "mam ekrim 1.1.jpg", "mam ekrim 1.2.jpg"],
    paras: [
      "<strong>KAMU KAMU KAMUUUUUUU!!</strong><br>of course, kamu itu selalu ada di pikiran aku, aku bangga udha jadi bagian di hidup kamu sengggg .",
      "maaafyaa aku selalu bikin kamu kecewa dan sedih semoga diumur 20 tahun ini kamu makin bahagia yaaa sama aku, dan semoga hubungan kita tetep berlanjut sampai lulus dan seterusnya:P",
      "and.... semangat yah menjadi anak pebeesi, kamu adalah sekbid kesas yang keren, hebat, cantik, baik, imut lucu, semoga naik waketum aminn wkwkwkwk"] },

  love: { title: "to love", photo: "cocok.jpg", age: "20", suffix: "th",
    paras: [
      "happy 20 th azzahra. semoga diumur kamu yang sudah menginjak kepala dua ini kamu semakin dewasa, semakin tabah, semakin cantikk pintar dan bahagia selalu.",
      "aku berharap banget di umur kamu yang baru ini kamu bahagia selalu dan ama yang kamu semogakan segera tercapai, amiin.",
      "Selamat ulang tahun my love Azzahra Awwalia Ramadhani, semoga perasaan sayang kamu ke aku ga akan pernah luntur sedikit pun"] },

  final: { photo: "first date 1.jpg", title: "Happy Birthday!!" },
  footer: "Made with love, just for you.",
};

/* ---------- render ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const TONES = ["#6b5156", "#8c6f73", "#52617d", "#a58a8e", "#43353a", "#7d6560", "#9a8a96"];
let t = 0;
const im = (src, alt = "", cls = "") => `<span class="im ${cls}" style="background:${TONES[t++ % TONES.length]}"><img src="${esc(src)}" alt="${esc(alt)}" loading="lazy"></span>`;
const star = '<svg class="star" width="42" height="42" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 1c.7 5.5 2.5 8.3 11 11-8.5 2.7-10.3 5.5-11 11-.7-5.5-2.5-8.3-11-11 8.5-2.7 10.3-5.5 11-11z"/></svg>';

function render() {
  const C = CONTENT, H = C.hero, T = C.things, S = C.sakti, R = C.rank, F = C.first, L = C.love;
  $("#app").innerHTML = `
  <section id="hero">${im(H.photo, "Foto ulang tahun", "fill")}
    <div class="wrap hin"><h1 class="rv">${esc(H.line1)}<span>${esc(H.line2)}</span></h1>
    <div class="num rv" aria-hidden="true">${esc(H.age)}<span style="font-size:.38em">${esc(H.suffix)}</span></div></div><div class="cue" aria-hidden="true"></div></section>

  <section id="things"><div class="collage" aria-hidden="true">${T.collage.map(s => `<div class="pol">${im(s)}</div>`).join("")}</div>
    <div class="wrap"><h2 class="rv"><span class="num">${esc(T.num)}</span> ${esc(T.text)} <span class="n18">${esc(T.age)}</span></h2></div></section>

  <section id="sakti"><div class="badge" aria-label="${esc(S.badge)}">${esc(S.badge)}</div>
    <div class="wrap"><h2 class="sh rv"><span class="num">${esc(S.num)}</span><span>${esc(S.w1)}</span><b>${esc(S.w2)}</b></h2>
    <div class="sg"><div class="card rv"><h3>${esc(S.head)}</h3><p>${esc(S.text)}</p></div><div class="cut">${im(S.photo, "Foto cutout")}</div></div></div></section>

  <section id="rank"><div class="wrap"><h2 class="rh rv"><span>${esc(R.label)}</span><span class="num">${esc(R.num)}</span><mark>${esc(R.highlight)}</mark></h2>
    <div class="rg"><div class="card rv"><h3>${esc(R.head)}</h3><p>${esc(R.text)}</p></div>
    <div class="pols rv">${star}${R.photos.map((s, i) => `<div class="pol p${i + 1}">${im(s)}</div>`).join("")}</div></div></div></section>

  <section id="first"><div class="wrap"><h2 class="fh rv"><span>${esc(F.pre)}</span><span class="num">${esc(F.num)}</span><span>${esc(F.post)}</span></h2>
    <div class="fg"><div class="ft rv">${F.paras.map(p => `<p>${p}</p>`).join("")}</div>
    <div class="cl rv" aria-hidden="true">${F.photos.map((s, i) => `<div style="grid-area:${["1/1/3/2", "2/2/5/4", "1/4/4/5", "4/1/7/2", "5/2/7/3", "5/3/7/5"][i]}">${im(s)}</div>`).join("")}</div></div></div></section>

  <section id="love"><div class="wrap lg"><div class="lp rv">${im(L.photo, "Foto", "fill")}<div class="num" aria-hidden="true">${esc(L.age)}<sup>${esc(L.suffix)}</sup></div><div class="sig">${esc(C.name)}</div></div>
    <div class="lt rv"><h2>${esc(L.title)}</h2>${L.paras.map(p => `<p>${esc(p)}</p>`).join("")}</div></div></section>

  <section id="final"><div class="fin">${im(C.final.photo, "Foto penutup", "fill")}<div><h2 class="rv">${esc(C.final.title)}</h2><p class="rv">${esc(C.name)}</p></div></div></section>
  <footer>${esc(C.footer)}</footer>`;

  // foto gagal dimuat -> tetap tampil kotak warna, tanpa ikon rusak
  document.querySelectorAll(".im img").forEach(i => {
    const ok = () => i.parentNode.style.background = "none", bad = () => i.remove();
    if (i.complete) (i.naturalWidth ? ok : bad)(); else { i.onload = ok; i.onerror = bad; }
  });
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .1 });
  document.querySelectorAll(".rv").forEach(el => io.observe(el));
}

/* ---------- gate ---------- */
const pin = $("#pin"), err = $("#err"), gate = $("#gate");
function unlock(instant) {
  try { sessionStorage.setItem("unlocked", "1"); } catch (e) {}
  gate.classList.add("open"); $("#app").removeAttribute("aria-hidden"); window.scrollTo(0, 0);
  setTimeout(() => gate.style.display = "none", instant ? 0 : 900);
}
function check() {
  const v = pin.value.trim();
  if (!v) { err.textContent = "Isi dulu tanggal spesial kita ya."; return; }
  if (v === PIN) { err.textContent = ""; unlock(); return; }
  err.textContent = "Belum tepat, coba ingat lagi tanggal spesial kita.";
  const c = $("#gcard"); c.classList.remove("shake"); void c.offsetWidth; c.classList.add("shake"); pin.select();
}
pin.addEventListener("input", () => { pin.value = pin.value.replace(/\D/g, ""); err.textContent = ""; if (pin.value.length === PIN.length) check(); });
pin.addEventListener("keydown", e => { if (e.key === "Enter") check(); });
$("#go").onclick = check;
render();
let s = false; try { s = sessionStorage.getItem("unlocked") === "1"; } catch (e) {}
if (s) unlock(true); else pin.focus({ preventScroll: true });
</script>
</body>
</html>
